<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFix - Campus Maintenance System</title>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("campusfix_theme");
          const studentDark = localStorage.getItem("campusfix_student_dark_mode");
          if (theme === "dark" || studentDark === "true") {
            document.documentElement.classList.add("dark");
          } else if (theme === "light" || studentDark === "false") {
            document.documentElement.classList.remove("dark");
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
